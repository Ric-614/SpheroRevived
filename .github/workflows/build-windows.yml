name: Build Windows executable

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Run offline tests
        run: python -m pytest -q

      - name: Build Windows executable
        run: |
          python -m PyInstaller --clean --noconfirm SpheroRevived.spec

      - name: Rename executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release
          Copy-Item dist\SpheroRevived.exe release\SpheroRevived-windows-x86_64.exe

      - name: Generate SHA-256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash `
            release\SpheroRevived-windows-x86_64.exe `
            -Algorithm SHA256).Hash.ToLower()

          "$hash  SpheroRevived-windows-x86_64.exe" |
            Out-File `
              release\SpheroRevived-windows-x86_64.exe.sha256 `
              -Encoding ascii

      - name: Upload Windows executable
        uses: actions/upload-artifact@v7
        with:
          path: release/SpheroRevived-windows-x86_64.exe
          archive: false

      - name: Upload checksum
        uses: actions/upload-artifact@v7
        with:
          path: release/SpheroRevived-windows-x86_64.exe.sha256
          archive: false

